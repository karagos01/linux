%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/mediatek,ufs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek Universal Flash Storage (UFS) Controller

maintainers:
  - Peter Wang <peter.wang@mediatek.com>
  - Chaotian Jing <chaotian.jing@mediatek.com>

properties:
  compatible:
    enum:
      - mediatek,mt6878-ufshci
      - mediatek,mt8183-ufshci
      - mediatek,mt8192-ufshci
      - mediatek,mt8195-ufshci

  clocks:
    minItems: 1
    maxItems: 13

  clock-names:
    minItems: 1
    maxItems: 13

  phys:
    maxItems: 1

  reg:
    maxItems: 1

  resets:
    minItems: 1
    maxItems: 4

  reset-names:
    minItems: 1
    items:
      - const: unipro_rst
      - const: crypto_rst
      - const: hci_rst
      - const: mphy_rst

  vcc-supply: true

  mediatek,ufs-disable-mcq:
    $ref: /schemas/types.yaml#/definitions/flag
    description: The mask to disable MCQ (Multi-Circular Queue) for UFS host.

required:
  - compatible
  - clocks
  - clock-names
  - phys
  - reg

unevaluatedProperties: false

allOf:
  - $ref: ufs-common.yaml

  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt8195-ufshci
    then:
      properties:
        clocks:
          minItems: 8
        clock-names:
          items:
            - const: ufs
            - const: ufs_aes
            - const: ufs_tick
            - const: unipro_sysclk
            - const: unipro_tick
            - const: unipro_mp_bclk
            - const: ufs_tx_symbol
            - const: ufs_mem_sub

  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt6878-ufshci
    then:
      properties:
        clocks:
          minItems: 13
        clock-names:
          items:
            - const: ufs_sel
            - const: ufs_fde
            - const: ufs_mbist
            - const: unipro_tx_sym
            - const: unipro_rx_sym0
            - const: unipro_rx_sym1
            - const: unipro_sys
            - const: unipro_phy_sap
            - const: phy_top_ahb_s_bus
            - const: ufshci_ufs
            - const: ufshci_aes
            - const: ufshci_ufs_ahb
            - const: ufshci_aes_axi
        resets:
          minItems: 3
        reset-names:
          minItems: 3

  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt8183-ufshci
              - mediatek,mt8192-ufshci
    then:
      properties:
        clocks:
          maxItems: 1
        clock-names:
          items:
            - const: ufs

  # The MT6878 powers its UFS rails outside this node (always-on / handled by
  # the bootloader), so vcc-supply is optional there. Every other SoC must
  # provide it.
  - if:
      not:
        properties:
          compatible:
            contains:
              const: mediatek,mt6878-ufshci
    then:
      required:
        - vcc-supply

examples:
  - |
    #include <dt-bindings/clock/mt8183-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        ufs@ff3c0000 {
            compatible = "mediatek,mt8183-ufshci";
            reg = <0 0x11270000 0 0x2300>;
            interrupts = <GIC_SPI 104 IRQ_TYPE_LEVEL_LOW>;
            phys = <&ufsphy>;

            clocks = <&infracfg_ao CLK_INFRA_UFS>;
            clock-names = "ufs";
            freq-table-hz = <0 0>;

            vcc-supply = <&mt_pmic_vemc_ldo_reg>;
        };
    };
