%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6878-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 clock controllers

maintainers:
  - Jan Benedikt <karagos01@gmail.com>

description:
  The MT6878 exposes several functional clock controllers as syscon register
  blocks - the top clock generator (topckgen), the PLL controller (apmixedsys)
  and the I2C "IMP" clock wrappers. Each provides clocks through a
  '#clock-cells' of 1.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt6878-topckgen
          - mediatek,mt6878-apmixedsys
          - mediatek,mt6878-imp_iic_wrap-cs
          - mediatek,mt6878-imp_iic_wrap-es
          - mediatek,mt6878-imp_iic_wrap-ws
          - mediatek,mt6878-imp_iic_wrap-ess
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  hw-voter-regmap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the hardware-voter syscon used by topckgen to vote for
      clocks shared with other subsystems.

  mediatek,hardware-voter:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the hardware-voter syscon used by apmixedsys.

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@10000000 {
        compatible = "mediatek,mt6878-topckgen", "syscon";
        reg = <0x10000000 0x1000>;
        #clock-cells = <1>;
        hw-voter-regmap = <&hwv>;
    };

  - |
    clock-controller@11281000 {
        compatible = "mediatek,mt6878-imp_iic_wrap-cs", "syscon";
        reg = <0x11281000 0x1000>;
        #clock-cells = <1>;
    };
