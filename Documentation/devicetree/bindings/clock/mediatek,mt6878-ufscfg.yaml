%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6878-ufscfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 UFS configuration clock and reset controllers

maintainers:
  - Kara <karagos01@gmail.com>

description:
  The MT6878 UFS configuration blocks (always-on and power-down) are syscon
  register regions that provide the UFS clocks and, through a ti,syscon-reset
  child, the UFS resets.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt6878-ufscfg-ao
          - mediatek,mt6878-ufscfg-pdn
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  reset-controller:
    type: object
    description: UFS reset lines, driven through the syscon (see ti,syscon-reset).

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@112b8000 {
        compatible = "mediatek,mt6878-ufscfg-ao", "syscon", "simple-mfd";
        reg = <0x112b8000 0x1000>;
        #clock-cells = <1>;

        reset-controller {
            compatible = "ti,syscon-reset";
            #reset-cells = <1>;
            ti,reset-bits = <0x48 8 0x4c 8 0 0 0>;
        };
    };
