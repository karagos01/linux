%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6878-apu-top.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 APU power controller

maintainers:
  - Jan Benedikt <karagos01@gmail.com>

description:
  The remote power controller (RPC) of the AI processing unit. It powers the
  APU up on request; only the APU firmware can send it back to sleep.

properties:
  compatible:
    const: mediatek,mt6878-apu-top

  reg:
    maxItems: 1

  '#power-domain-cells':
    const: 0

required:
  - compatible
  - reg
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    power-controller@190f0000 {
        compatible = "mediatek,mt6878-apu-top";
        reg = <0x190f0000 0x1000>;
        #power-domain-cells = <0>;
    };
