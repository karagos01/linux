%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6878-apu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 APU firmware host interface

maintainers:
  - Jan Benedikt <karagos01@gmail.com>

description:
  The mailbox through which the host talks to the firmware of the AI
  processing unit. The firmware image is placed in secure memory by the
  bootloader and started through the secure monitor; everything the host
  shares with it is addressed through the APU IOMMU.

properties:
  compatible:
    const: mediatek,mt6878-apu

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    remoteproc@190e1000 {
        compatible = "mediatek,mt6878-apu";
        reg = <0x190e1000 0x1000>;
        interrupts = <GIC_SPI 586 IRQ_TYPE_LEVEL_HIGH 0>;
        iommus = <&apu_iommu 0>;
        power-domains = <&apu_top>;
    };
