%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6878-gps.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 connsys GNSS (GPS) subsystem

maintainers:
  - Kara <karagos01@gmail.com>

description:
  The GNSS (GPS) function of the MT6878 connsys combo. It sits on top of the
  shared conn_infra and A-die owned by the connsys controller, which it
  references through a "mediatek,connsys" phandle. The node exposes the GPS
  register window and the conn_infra control window, plus the host-side
  interrupts of the two GPS links (data, no-data and MCU-mailbox each) and the
  DMA engine.

properties:
  compatible:
    const: mediatek,mt6878-gps

  reg:
    items:
      - description: GPS (conn_gps) register window
      - description: shared conn_infra register window

  reg-names:
    items:
      - const: conn_gps
      - const: conn_infra

  interrupts:
    items:
      - description: link0 data
      - description: link0 no-data
      - description: link0 MCU-mailbox (MCUB)
      - description: link1 data
      - description: link1 no-data
      - description: link1 MCU-mailbox (MCUB)
      - description: DMA

  mediatek,connsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the connsys controller that owns the shared conn_infra, the
      A-die and the connsys power domain.

  pinctrl-names:
    const: default

  pinctrl-0:
    description:
      The external GPS L1/L5 eLNA enable GPIOs, driven high while the GPS
      device is bound.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - mediatek,connsys

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        gps@18c00000 {
            compatible = "mediatek,mt6878-gps";
            reg = <0x0 0x18c00000 0x0 0x100000>,
                  <0x0 0x18000000 0x0 0x100000>;
            reg-names = "conn_gps", "conn_infra";
            interrupts = <GIC_SPI 379 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 380 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 381 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 382 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 383 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 389 IRQ_TYPE_LEVEL_HIGH 0>,
                         <GIC_SPI 129 IRQ_TYPE_LEVEL_HIGH 0>;
            mediatek,connsys = <&connsys>;
            pinctrl-names = "default";
            pinctrl-0 = <&gps_elna_pins>;
        };
    };
