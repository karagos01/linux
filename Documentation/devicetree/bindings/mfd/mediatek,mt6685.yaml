%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mediatek,mt6685.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6685 SPMI PMIC

maintainers:
  - Kara <karagos01@gmail.com>

description:
  The MT6685 is a MediaTek companion PMIC on the System Power Management
  Interface (SPMI) bus, providing the clock-buffer and related functions for
  the connectivity A-die. It is a multi-function device whose sub-functions
  are described in child nodes.

  The MT6685 aggregates its sub-function interrupts (such as the RTC alarm)
  into one SCK_TOP interrupt group that it raises on its SPMI interrupt line.
  When that line is wired up the PMIC acts as an interrupt controller for its
  sub-functions, which reference their interrupt by its number in the group.

properties:
  compatible:
    const: mediatek,mt6685

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description:
      The SPMI interrupt line on which the PMIC raises its aggregated
      SCK_TOP interrupt group.

  interrupt-controller: true

  "#interrupt-cells":
    const: 2
    description:
      The first cell is the sub-function interrupt number within the SCK_TOP
      group, the second cell is the trigger type.

  rtc:
    type: object
    $ref: /schemas/rtc/rtc.yaml#
    unevaluatedProperties: false
    description:
      MT6685 Real Time Clock.

    properties:
      compatible:
        const: mediatek,mt6685-rtc

      interrupts:
        maxItems: 1

    required:
      - compatible

required:
  - compatible
  - reg

dependencies:
  interrupt-controller: ["#interrupt-cells", interrupts]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>

    spmi {
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@9 {
            compatible = "mediatek,mt6685";
            reg = <0x9 SPMI_USID>;
            interrupts = <9 0 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-controller;
            #interrupt-cells = <2>;

            rtc {
                compatible = "mediatek,mt6685-rtc";
                interrupts = <0 IRQ_TYPE_LEVEL_HIGH>;
            };
        };
    };
