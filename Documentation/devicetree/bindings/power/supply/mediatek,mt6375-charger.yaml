%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6375-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6375 Battery Charger

maintainers:
  - Jan Benedikt <karagos01@gmail.com>

description:
  This module is part of the MT6375 MFD device. It provides the single-cell
  switching battery charger with BC1.2 USB port detection.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: mediatek,mt6375-charger

  monitored-battery:
    description:
      The battery the charger feeds. Its constant-charge-current-max-microamp,
      constant-charge-voltage-max-microvolt and charge-term-current-microamp
      set the charge current, the charge voltage and the end-of-charge
      termination current.

  interrupts:
    description:
      The charger uses the power-ready and detach events to track whether an
      input supply is present and the BC1.2-done event to learn the detected
      USB port type.
    items:
      - description: irq of "input power is ready"
      - description: irq of "input detached"
      - description: irq of "BC1.2 detection is done"

  interrupt-names:
    items:
      - const: attach
      - const: detach
      - const: bc12_done

  usb-otg-vbus-regulator:
    type: object
    $ref: /schemas/regulator/regulator.yaml#
    description:
      The VBUS boost regulator that sources 5V on the USB Type-C port in
      OTG/host mode.
    unevaluatedProperties: false

required:
  - compatible
  - interrupts
  - interrupt-names

unevaluatedProperties: false

...
