%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6375-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6375 Fuel Gauge

maintainers:
  - Kara <karagos01@gmail.com>

description:
  This module is part of the MT6375 MFD device. It reports the battery
  voltage and current from the on-chip ADC and derives the state of charge
  from the open-circuit-voltage table of the monitored battery.

properties:
  compatible:
    const: mediatek,mt6375-gauge

  io-channels:
    items:
      - description: battery voltage
      - description: battery current

  io-channel-names:
    items:
      - const: vbat
      - const: ibat

  monitored-battery: true

required:
  - compatible
  - io-channels
  - io-channel-names
  - monitored-battery

additionalProperties: false

...
